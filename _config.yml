# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Christine Dowling
description: "I'm a data scientist based in Calgary who enjoys turning messy data into decisions people can act on. My projects span machine learning, experimentation, analytics and generative AI, with recent work in anti-money laundering and fraud detection. Each one walks through the approach, the results and what I'd do next. The code is on GitHub, and I'm happy to connect on LinkedIn."
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Project <span class="accent">Portfolio</span>
location: "Calgary, AB, Canada"
resume_url: /docs/Christine_Dowling_Resume.docx
avatar_image: /img/profile_picture.JPG

#-------------------------------
# Contact links
linkedln: "https://linkedin.com/in/christine-dowling-a92844116" # Add your linkedln handle
github: "https://github.com/cadowling"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


